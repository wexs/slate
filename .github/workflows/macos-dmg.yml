name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        run: >-
          xcodebuild
          -project slate.xcodeproj
          -scheme slate
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/slate.app"
          STAGING_PATH="build/dmg-staging"
          DMG_PATH="build/Slate-${GITHUB_REF_NAME}.dmg"

          test -d "$APP_PATH"
          mkdir -p "$STAGING_PATH"
          cp -R "$APP_PATH" "$STAGING_PATH/Slate.app"
          ln -s /Applications "$STAGING_PATH/Applications"
          hdiutil create \
            -volname "Slate" \
            -srcfolder "$STAGING_PATH" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slate-${{ github.ref_name }}-dmg
          path: build/Slate-${{ github.ref_name }}.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/Slate-${GITHUB_REF_NAME}.dmg" --title "Slate ${GITHUB_REF_NAME}" --generate-notes
